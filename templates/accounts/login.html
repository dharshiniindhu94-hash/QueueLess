
{% extends 'base.html' %}

{% block title %}Patient Login | QueueLess{% endblock %}

{% block content %}

<section class="auth-container">

    <div class="auth-card">

        <h1>Welcome Back!</h1>

        <p class="auth-subtitle">
            Login to your QueueLess account
        </p>

        <form method="POST">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="btn auth-btn">
                Login
            </button>
        </form>

        <p class="auth-footer">
            New patient?
            <a href="{% url 'register' %}">Create an account</a>
        </p>

    </div>

</section>

{% endblock %}
