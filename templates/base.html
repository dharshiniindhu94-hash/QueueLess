


{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}QueueLess{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="logo">
            QueueLess
        </div>

        <div class="nav-links">

            <a href="{% url 'home' %}">Home</a>

            <a href="{% url 'clinic_list' %}">Clinics</a>

            {% if user.is_authenticated %}

                {% if user.doctor_profile %}

                    <a href="{% url 'doctor_dashboard' %}">
                        Doctor Dashboard
                    </a>

                {% else %}

                    <a href="{% url 'book_token' %}">
                        Book Token
                    </a>

                    <a href="{% url 'my_bookings' %}">
                        My Bookings
                    </a>

                {% endif %}

                <a href="{% url 'logout' %}">
                    Logout
                </a>

            {% else %}

                <a href="{% url 'login' %}">
                    Login
                </a>

                <a href="{% url 'register' %}">
                    Register
                </a>

            {% endif %}

        </div>

    </nav>

    <!-- PAGE CONTENT -->

    {% block content %}
    {% endblock %}

</body>

</html>
