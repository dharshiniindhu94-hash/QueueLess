
<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QueueLess | {{ title }}</title>

    <link rel="stylesheet"
          href="{% static 'css/admin_dashboard.css' %}">
</head>

<body>

<div class="main-content form-page">

    <h1>{{ title }}</h1>
    <p>Enter doctor information below.</p>

    <form method="POST" class="clinic-form">
        {% csrf_token %}

        {% if form.non_field_errors %}
            <div class="form-errors">
                {{ form.non_field_errors }}
            </div>
        {% endif %}

        {% for field in form %}
            <div class="form-group">

                <label for="{{ field.id_for_label }}">
                    {{ field.label }}
                </label>

                {{ field }}

                {% for error in field.errors %}
                    <p class="field-error">{{ error }}</p>
                {% endfor %}

            </div>
        {% endfor %}

        <button type="submit" class="add-button">
            Save Doctor
        </button>

        <a href="{% url 'clinic_admin_list' %}"
           class="cancel-button">
            Cancel
        </a>

    </form>

</div>

</body>
</html>
